<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>景越文档导航站</title>
  <meta name="description" content="景越与钰衍团队共用的 WPS 文档导航站，支持按团队切换、搜索和预览。" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1 id="siteTitle">WPS文档导航</h1>
        <p id="siteSubtitle">WPS 文档内嵌导航小站</p>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="搜索文档、分组、关键词" />
        <div class="toolbar-actions">
          <button id="refreshBtn" class="btn small" type="button">刷新数据</button>
          <button id="toggleAllGroupsBtn" class="btn small secondary" type="button">全部折叠</button>
        </div>
        <div id="statusBar" class="status-bar">准备加载动态数据…</div>
      </div>

      <nav id="nav" class="nav" aria-label="文档导航"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="docTitle">请选择一个文档</h2>
          <p id="docMeta">左侧选择后在这里预览</p>
        </div>
        <div class="actions">
          <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="切换到暗色主题" title="切换到暗色主题">
            <span class="theme-icon theme-icon-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
              </svg>
            </span>
            <span class="theme-icon theme-icon-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2.2M12 19.8V22M4.22 4.22l1.56 1.56M18.22 18.22l1.56 1.56M2 12h2.2M19.8 12H22M4.22 19.78l1.56-1.56M18.22 5.78l1.56-1.56"></path>
              </svg>
            </span>
          </button>
          <button id="focusModeBtn" class="btn secondary" type="button">沉浸预览</button>
          <button id="fullscreenBtn" class="btn secondary" type="button">浏览器全屏</button>
          <a id="openLink" class="btn secondary" href="#" target="_blank" rel="noopener noreferrer">新标签打开</a>
          <button id="copyLink" class="btn" type="button">复制链接</button>
        </div>
      </header>

      <section id="viewerWrap" class="viewer-wrap">
        <div id="embedNotice" class="notice">
          <strong>说明：</strong> 如果 WPS 文档不允许 iframe 内嵌，右上角点 <strong>“新标签打开”</strong> 即可正常查看。
        </div>
        <iframe id="viewer" title="WPS 文档预览" referrerpolicy="no-referrer" allowfullscreen loading="lazy"></iframe>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
